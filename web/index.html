    <!--
      THESIS: A trip briefing reads like a ship's log, not a wizard —
      evidence is the plan's hull, not a footnote.
      OWN-WORLD: Ivory paper, ink text, a single oxidized-bronze accent;
      green only for verdict=supported, vermilion only for
      verdict=contradicted and failure; hairline chart graticule, lat/lon
      coordinates, and archive numbers as texture.
      STORY: The traveller enters a destination and dates, watches the
      pipeline sail through research/verify/plan/write with real evidence
      counts, then reads the itinerary as a day-by-day log where every
      claim opens its sworn record.
      FIRST VIEWPORT: Destination owns the upper third at display scale on
      a chart-grid ground, dates beside it; every other condition stays
      collapsed until opened.
      FORM: Brief-pinned "modern sailing log" world — fixed in PRODUCT.md's
      Brand Commitments; no direction roll run.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
